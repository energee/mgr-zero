<meta charset="utf-8">
<title>MGR Wireframes</title>
<!--
  MGR screen inventory as low-fi wireframes. Companion to 2026-08-31-mgr-ui-layout-plan.md:
  one wireframe per §4 row (plus sub-screens), tagged with tab, slice, build step, and the
  queries/commands it uses. Edit the SCREENS array at the bottom (plus TABS/RAIL for nav and
  STEPS for build order — both mirror the plan); the page renders itself.
  Published as an artifact from this path; keep the file self-contained (no external assets).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F2F3F1;--sf:#FFFFFF;--ink:#1B221E;--ink2:#66736C;--line:#B9C1BB;--line2:#DDE2DE;--acc:#1F4D3A;--warn:#C99A2E;--irr:#B5652E;--wire:#9AA49E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151A17;--sf:#1E2622;--ink:#EDF0EE;--ink2:#A3ADA7;--line:#3D4842;--line2:#2C352F;--acc:#7FB89F;--warn:#E0B24A;--irr:#D98A4F;--wire:#5F6B64}}
:root[data-theme="dark"]{--bg:#151A17;--sf:#1E2622;--ink:#EDF0EE;--ink2:#A3ADA7;--line:#3D4842;--line2:#2C352F;--acc:#7FB89F;--warn:#E0B24A;--irr:#D98A4F;--wire:#5F6B64}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Instrument Sans",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:26px;margin:0 0 4px;font-weight:600}
.sub{color:var(--ink2);max-width:70ch;margin:0 0 16px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.bar button{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:3px;padding:4px 10px;font:12px "JetBrains Mono",monospace;cursor:pointer}
.bar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar .sep{width:1px;background:var(--line);margin:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 18px}
.sc{display:flex;flex-direction:column;gap:8px}
.sc.hide{display:none}
.sc.wide{grid-column:1/-1}
.meta{font:11px "JetBrains Mono",monospace;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap}
.meta b{color:var(--acc);font-weight:500}
.meta .b{border:1px solid var(--line);border-radius:3px;padding:0 5px}
.name{font-weight:600;font-size:14px}
.job{color:var(--ink2);font-size:12px;margin-top:-4px}
.io{font:11px/1.5 "JetBrains Mono",monospace;color:var(--ink2);border-top:1px solid var(--line2);padding-top:6px;overflow-wrap:anywhere}
.io span{color:var(--ink)}
/* frame */
.ph{background:var(--sf);border:1.5px solid var(--line);border-radius:18px;height:520px;display:flex;flex-direction:column;overflow:hidden;font-size:11.5px}
.ph.desk{height:auto;min-height:300px;border-radius:6px;flex-direction:row}
.ph.desk .rail{width:150px;border-right:1px dashed var(--line);padding:10px;color:var(--ink2);font-size:11px;display:flex;flex-direction:column;gap:3px}
.ph.desk .body{flex:1;padding:12px;display:grid;grid-template-columns:1fr 1.4fr;gap:10px;align-content:start;min-width:0}
.ph.desk .body.one{grid-template-columns:1fr}
@media (max-width:700px){.ph.desk .rail{display:none}.ph.desk .body{grid-template-columns:1fr}}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;font-weight:600;font-size:12.5px;border-bottom:1px dashed var(--line2)}
.hd i{font:10px "JetBrains Mono",monospace;color:var(--ink2);font-style:normal}
.bd{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ttl{font-weight:600;font-size:15px;margin:2px 0}
.r{border:1px dashed var(--wire);border-radius:3px;padding:6px 8px;display:flex;justify-content:space-between;gap:6px;align-items:center;background:var(--sf)}
.r small{display:block;color:var(--ink2);font-size:10px}
.r.w{border-left:3px solid var(--warn)}
.r.ok{border-left:3px solid var(--acc)}
.r .n{font:12px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{border:1.5px solid var(--acc);color:var(--acc);border-radius:3px;padding:9px;text-align:center;font-weight:600;min-height:40px;display:flex;align-items:center;justify-content:center}
.btn.p{background:var(--acc);color:#fff}
.btn.irr{background:var(--irr);border-color:var(--irr);color:#fff}
.btn.g{border-color:var(--line);color:var(--ink);font-weight:500}
.btns{display:grid;gap:6px}
.btns.c2{grid-template-columns:1fr 1fr}.btns.c3{grid-template-columns:1fr 1fr 1fr}
.num{border:1px dashed var(--wire);border-radius:3px;padding:8px;text-align:right}
.num b{display:block;font:500 24px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.num span{font:10px "JetBrains Mono",monospace;color:var(--ink2)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips span{border:1px solid var(--line);border-radius:3px;padding:2px 6px;font:10px "JetBrains Mono",monospace}
.chips span.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:auto}
.pad div{border:1px solid var(--line2);border-radius:3px;height:34px;display:flex;align-items:center;justify-content:center;font:14px "JetBrains Mono",monospace}
.tape{border-left:2px solid var(--line);margin-left:3px;padding-left:8px;display:flex;flex-direction:column;gap:4px;font:10.5px "JetBrains Mono",monospace}
.tape div{display:flex;justify-content:space-between;gap:6px;position:relative}
.tape div::before{content:"";position:absolute;left:-12px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.fld{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.fld span{font:11px "JetBrains Mono",monospace;color:var(--acc);text-align:right}
.note{border:1px dashed var(--warn);border-radius:3px;padding:6px 8px;font-size:11px;color:var(--ink2)}
.stp{display:flex;align-items:center;gap:3px;font:9.5px "JetBrains Mono",monospace;color:var(--ink2)}
.stp i{flex:1;height:2px;background:var(--line2)}.stp i.d{background:var(--acc)}.stp b{font-weight:400}.stp b.c{color:var(--acc);font-weight:500}
.tl{display:grid;gap:4px}
.tl div{border:1px dashed var(--wire);border-radius:3px;padding:6px;min-height:52px;display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px}
.tl div b{font-size:12px}.tl div.w{border-left:3px solid var(--warn)}
table.t{width:100%;border-collapse:collapse;font:10.5px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:3px 4px;border-bottom:1px dashed var(--line2);text-align:right}
table.t th{color:var(--ink2);font-weight:500}
table.t td:first-child,table.t th:first-child{text-align:left;font-family:"Instrument Sans",sans-serif}
.blank{flex:1;border:1px dashed var(--wire);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:11px;text-align:center;padding:10px;min-height:60px}
.comp{margin:0 10px 6px;border:1px dashed var(--wire);border-radius:3px;padding:8px 10px;color:var(--ink2);display:flex;justify-content:space-between}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px dashed var(--line);padding:6px 0 10px;font-size:10px;text-align:center;color:var(--ink2)}
.tabs .on{color:var(--acc);font-weight:600}
.inp{border:1px solid var(--line);border-radius:3px;padding:8px;color:var(--ink2)}
h2.grp{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 -8px;font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em}
h2.grp.hide{display:none}
</style>

<div class="wrap">
  <h1>MGR wireframes</h1>
  <p class="sub">One low-fi frame per screen in the UI layout plan §4, grouped by build step. Dashed = wire, green = interactive, copper = irreversible write, amber = attention. Under each frame: the queries it reads and the commands it writes. Filter by tab or build step.</p>
  <div class="bar" id="bar"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
// ---- tiny renderer -------------------------------------------------------
const TABS=['Today','Beer','Work','More'];
// Desk rail: the four tabs as group headers, each with its areas (plan §3).
const RAIL={Today:[],Beer:['Inventory','Cellar','Materials','Kegs'],Work:['Orders','Batches','Packaging','POs','Deliveries'],More:['Catalog','Customers','Recipes','Compliance','Planning','Settings']};
const RAIL_HTML=TABS.flatMap(t=>[RAIL[t].length?`<b>${t}</b>`:t,...RAIL[t]]).map(x=>`<div>${x}</div>`).join('');
const E={
  hd:(t,r='')=>`<div class="hd"><span>${t}</span><i>${r}</i></div>`,
  ttl:(t)=>`<div class="ttl">${t}</div>`,
  row:(t,s='',n='',cls='')=>`<div class="r ${cls}"><span>${t}${s?`<small>${s}</small>`:''}</span><span class="n">${n}</span></div>`,
  btn:(t,k='p')=>`<div class="btn ${k}">${t}</div>`,
  btns:(arr,k='p',c='c3')=>`<div class="btns ${c}">${arr.map(t=>E.btn(...[].concat(t,k))).join('')}</div>`,
  num:(v,s)=>`<div class="num"><b>${v}</b><span>${s}</span></div>`,
  chips:(arr,on=0)=>`<div class="chips">${arr.map((c,i)=>`<span class="${i===on?'on':''}">${c}</span>`).join('')}</div>`,
  pad:()=>`<div class="pad">${'1 2 3 4 5 6 7 8 9 . 0 ⌫'.split(' ').map(k=>`<div>${k}</div>`).join('')}</div>`,
  tape:(arr)=>`<div class="tape">${arr.map(([a,b])=>`<div><span>${a}</span><span>${b||''}</span></div>`).join('')}</div>`,
  fld:(k,v)=>`<div class="fld"><b>${k}</b><span>${v}</span></div>`,
  note:(t)=>`<div class="note">${t}</div>`,
  stp:(arr,cur)=>`<div class="stp">${arr.map((s,i)=>`<b class="${i===cur?'c':''}">${s}</b>${i<arr.length-1?`<i class="${i<cur?'d':''}"></i>`:''}`).join('')}</div>`,
  tiles:(arr,cols=3)=>`<div class="tl" style="grid-template-columns:repeat(${cols},1fr)">${arr.map(([n,s,g,w])=>`<div class="${w?'w':''}"><b>${n}</b><span>${s}</span><span>${g||''}</span></div>`).join('')}</div>`,
  tbl:(hd,rows)=>`<table class="t"><tr>${hd.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`,
  blank:(t)=>`<div class="blank">${t}</div>`,
  inp:(t)=>`<div class="inp">${t}</div>`,
  sp:()=>`<div style="flex:1"></div>`,
  comp:()=>`<div class="comp"><span>Say what happened…</span><span>mic</span></div>`,
  tabs:(on)=>`<div class="tabs">${TABS.map(t=>`<div class="${t===on?'on':''}">${t}</div>`).join('')}</div>`,
};
const W=(t)=>`<span style="color:var(--warn)">${t}</span>`;
function phone(s){return `<div class="ph">${s.hd||''}<div class="bd">${s.body.join('')}</div>${s.comp?E.comp():''}${s.tabbar?E.tabs(s.tabbar):''}</div>`;}
function desk(s){return `<div class="ph desk"><div class="rail">${RAIL_HTML}</div><div class="body ${s.one?'one':''}">${s.body.join('')}</div></div>`;}
// Mirrors plan §7 build order — change both together.
const STEPS={1:'Entry (sign-in, onboarding, import)',2:'Shell + Today',3:'Pads, pickers, tape (movement form)',4:'Composer',5:'Orders 1B',6:'Portal',7:'Later slices'};
function render(){
  let out='',last=null;
  for(const s of SCREENS){
    const grp=s.portal?'Portal':s.desk?'Desk':s.tab;
    if(s.step!==last){out+=`<h2 class="grp">Build step ${s.step} — ${STEPS[s.step]}</h2>`;last=s.step;}
    out+=`<div class="sc ${s.desk?'wide':''}" data-g="${grp}" data-s="${s.step}">
      <div class="meta"><b>${grp}</b><span class="b">slice ${s.slice}</span><span class="b">step ${s.step}</span></div>
      <div class="name">${s.name}</div><div class="job">${s.job}</div>
      ${s.desk?desk(s):phone(s)}
      <div class="io">reads <span>${s.reads}</span><br>writes <span>${s.writes}</span></div></div>`;
  }
  document.getElementById('grid').innerHTML=out;
}
function filter(ft,fs){
  const g=document.getElementById('grid');
  g.querySelectorAll('.sc').forEach(c=>c.classList.toggle('hide',!((ft==='all'||c.dataset.g===ft)&&(fs==='all'||c.dataset.s===fs))));
  g.querySelectorAll('h2.grp').forEach(h=>{let n=h.nextElementSibling,any=false;while(n&&!n.classList.contains('grp')){if(!n.classList.contains('hide'))any=true;n=n.nextElementSibling;}h.classList.toggle('hide',!any);});
}
function bar(){
  const tabs=['all',...TABS,'Portal','Desk'],steps=['all',...Object.keys(STEPS)];
  let t='all',st='all';const b=document.getElementById('bar');
  b.innerHTML=tabs.map(x=>`<button data-t="${x}">${x==='all'?'all tabs':x}</button>`).join('')+'<span class="sep"></span>'+steps.map(x=>`<button data-s="${x}">${x==='all'?'all steps':'step '+x}</button>`).join('');
  const apply=()=>{b.querySelectorAll('button').forEach(k=>k.classList.toggle('on',k.dataset.t===t||k.dataset.s===st));filter(t,st);};
  b.addEventListener('click',e=>{const k=e.target.closest('button');if(!k)return;if(k.dataset.t)t=k.dataset.t;if(k.dataset.s)st=k.dataset.s;apply();});
  apply();
}

{step:1,slice:1,tab:'More',name:'Reset password',job:'Recover an account',reads:'—',writes:'auth.resetPasswordForEmail',

{step:1,slice:1,tab:'More',name:'Create brewery (SaaS)',job:'Provision a tenant',reads:'DEPLOYMENT_MODE=saas',writes:'brewery.create (breweries + admin brewery_users row)',
 hd:H('MGR'),body:[E.ttl('New brewery'),E.inp('Brewery name'),E.inp('Timezone'),E.inp('TTB registry no. (optional)'),E.btn('Create brewery'),E.note('Hidden in dedicated mode.')]},
{step:1,slice:1,tab:'Today',name:'First run checklist',job:'Turn an empty brewery into a usable one',reads:'counts of locations, skus, brewery_users, opening_balance rows',writes:'— (links to actions)',
 hd:H('◐ Demo Brewing','TS'),body:[E.ttl('Set up Demo Brewing'),E.row('1 · Add your locations','warehouse, taproom…','›','ok'),E.row('2 · Import or add catalog','CSV or one product at a time','›'),E.row('3 · Invite your team','admin, sales, warehouse, brewer','›'),E.row('4 · Opening inventory','counts → opening_balance rows','›'),E.note('Replaces the empty Today inbox until all four are done.')],comp:true,tabbar:'Today'},
{step:1,slice:1,desk:true,name:'Import wizard',job:'Upload → map → preview → commit; idempotent re-runs',reads:'skus, customers, locations for matching',writes:'import.customers / skus / priceLists / openingBalances (atomic-exempt, per row)',
 one:true,body:[E.stp(['upload','map columns','preview','commit'],2),E.tbl(['row','customer','ship-to','state','status'],[['1','Sly Fox','Main','PA','ok'],['2','Al’s Bar','—','OH',W('missing ship-to')],['3','Teresa’s','Dock','PA','exists · skip']]),E.btns([['Back','g'],['Import 2 rows','irr']],'p','c2')]},
// step 2 — shell
{step:2,slice:1,tab:'Today',name:'Today',job:'What needs doing, across slices',reads:'q.today (picks due, negative ATP, below par, overdue readings, failed pushes)',writes:'—',
 hd:H('◐ Demo Brewing','⌕ TS'),body:[E.ttl('Today'),E.row('3 orders to pick','ship today','›','w'),E.row('FV3 reading overdue','31 h','›','w'),E.row('Taproom: Pils below par','4 / 8','›','w'),E.row('PO 0142 arrives Thu','Country Malt','›','ok'),E.btns(['Record','Pick','Reading'])],comp:true,tabbar:'Today'},
{step:2,slice:1,tab:'Beer',name:'Beer',job:'What we have: FG, cellar, materials, kegs',reads:'v_on_hand, v_atp, v_occupancy, v_material_on_hand, v_keg_balances',writes:'—',
 hd:H('◐ Demo Brewing','⌕ TS'),body:[E.ttl('Beer'),E.row('Finished goods','ATP by SKU','11 · −6'),E.row('Cellar','6 vessels · 1 overdue','›'),E.row('Materials','3 short','›'),E.row('Kegs','142 out · 38 at Sly Fox','›'),E.blank('sections collapse to totals; tap to expand')],comp:true,tabbar:'Beer'},
{step:2,slice:1,tab:'Work',name:'Work',job:'What’s in motion',reads:'open orders, batches, packaging_runs, purchase_orders, deliveries',writes:'—',
 hd:H('◐ Demo Brewing','⌕ TS'),body:[E.ttl('Work'),E.chips(['all','orders','batches','runs','POs','routes']),E.row('ORD-0231 Sly Fox','confirmed · ship Thu','›'),E.row('B-0413 Stout','FV3 · d7','›'),E.row('PO-0142 Country Malt','arrives Thu','›'),E.row('RUN-0031 Hazy cans','planned Fri','›')],comp:true,tabbar:'Work'},
{step:2,slice:1,tab:'More',name:'More',job:'Desk things, two taps deep',reads:'role',writes:'—',

{step:2,slice:1,tab:'More',name:'Search',job:'One picker across kinds',reads:'q.search (skus, customers, orders, lots, vessels, materials)',writes:'—',

{step:2,slice:1,tab:'More',name:'Settings',job:'Brewery, locations, team, integrations, notifications',reads:'breweries, locations, brewery_users, *_connections',writes:'brewery.update, location.upsert, invite.staff',
 hd:H('‹ More','Settings'),body:[E.row('Brewery','Demo Brewing · America/New_York · TTB BR-PA-…','›'),E.row('Locations','Warehouse, Taproom','›'),E.row('Team','5 people · 1 invite pending','›'),E.row('Integrations','QuickBooks ✓ · Square —','›'),E.row('Notifications','sent log','›'),E.row('Import','CSV wizard','›')]},

{step:3,slice:1,tab:'Beer',name:'Inventory · SKU detail',job:'On-hand, ATP, movement tape per SKU',reads:'v_on_hand, v_atp by location; inventory_movements',writes:'—',

 hd:H('◐ Demo Brewing','⌕ TS'),body:[E.row('“blew a half of Hazy at the taproom”'),E.fld('Type','depletion'),E.fld('SKU','Hazy IPA ½bbl'),E.fld('Qty','−1 keg (0.5 bbl)'),E.fld('Location','Taproom'),E.btns([['Open as form','g'],['Commit','irr']],'p','c2'),E.tape([['−1 depletion · taproom','queued']])],comp:true,tabbar:'Today'},
