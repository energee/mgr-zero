version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # chat and its adapters pin each other's exact version; bumped apart they fail tsc.
      chat-sdk:
        patterns:
          - "chat"
          - "@chat-adapter/*"
      # fumadocs-mdx requires a matching fumadocs-core; bumped apart the build fails.
      fumadocs:
        patterns:
          - "fumadocs-*"
      # tests/tooling-contract.test.ts pins next and eslint-config-next to one patch.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
