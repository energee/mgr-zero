# .github/workflows/ci.yml — RLS + command tests gate every merge.
#
# Runs against a clean local Supabase stack (default ports; no offset needed
# in CI since nothing else is running on the runner). Env vars for the test
# suite are derived from `supabase status -o env` rather than hardcoded, so
# this keeps working if local ports/keys ever change.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: supabase db reset
      - name: Env from local stack
        # `supabase status -o env` prints KEY="value" lines. Grep the three
        # keys the app/tests need, then strip the surrounding quotes before
        # appending to $GITHUB_ENV (GITHUB_ENV does no shell-quote parsing —
        # a literal quote in the value would end up baked into the secret).
        run: |
          supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|API_URL)=' | sed 's/"//g' >> "$GITHUB_ENV"
      - run: npx vitest run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
      - run: npx tsc --noEmit
      - run: npm run build
