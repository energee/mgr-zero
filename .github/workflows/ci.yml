# .github/workflows/ci.yml — RLS + command tests gate every merge.
#
# Runs against a local Supabase stack. Ports are set in the committed
# supabase/config.toml (54341/54342/54343), same as every local dev machine.
# Env vars for the test suite are derived from `supabase status -o env`
# rather than hardcoded, so this keeps working if the config ever changes.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # TDD gate diffs against the PR base
      # TDD gate: logic-layer changes must ship with test changes in the same
      # PR (AGENTS.md operating loop step 3). UI layers (app/, components/)
      # are exempt — rendering is verified visually, not by vitest. Escape
      # hatch for genuinely test-free changes: put [no-tests] in the PR title.
      - name: TDD gate — logic changes ship with tests
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[no-tests]')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          code=$(echo "$changed" | grep -E '^(lib/|scripts/|supabase/|proxy\.ts)' | grep -vE '\.test\.' || true)
          tests=$(echo "$changed" | grep -E '(^tests/|\.test\.)' || true)
          if [ -n "$code" ] && [ -z "$tests" ]; then
            echo "::error::Logic-layer files changed with no test changes. TDD: the failing test comes first and ships in the same PR. Exempt a test-free change with [no-tests] in the PR title."
            echo "$code"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 }
      # Only the services the tests touch (Postgres, Auth, PostgREST, Kong).
      # Everything excluded is an image pull we'd otherwise wait ~60s+ for.
      # `start` on a fresh stack already applies supabase/migrations/*, so
      # there is no separate `db reset` step here.
      - run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime,realtime,storage-api,mailpit,supavisor,postgres-meta
      - name: Env from local stack
        # `supabase status -o env` prints KEY="value" lines. Grep the three
        # keys the app/tests need, then strip the surrounding quotes before
        # appending to $GITHUB_ENV (GITHUB_ENV does no shell-quote parsing —
        # a literal quote in the value would end up baked into the secret).
        run: |
          supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|API_URL)=' | sed 's/"//g' >> "$GITHUB_ENV"
      - run: npx vitest run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
