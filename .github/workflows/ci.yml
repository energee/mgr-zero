# .github/workflows/ci.yml — RLS + command tests gate every merge.
#
# Runs against the isolated test Supabase stack. Ports are set in the committed
# tests/supabase/supabase/config.toml (54351/54352/54354).
# Env vars for the test suite are derived from `supabase status -o env`
# rather than hardcoded, so this keeps working if the config ever changes.
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54341
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-only
      SUPABASE_SECRET_KEY: ci-build-only
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # TDD gate diffs against the PR base
      # TDD gate: logic-layer changes must ship with test changes in the same
      # PR (AGENTS.md operating loop step 3). UI layers (app/, components/)
      # are exempt — rendering is verified visually, not by vitest. Escape
      # hatch for genuinely test-free changes: put [no-tests] in the PR title.
      - name: TDD gate — logic changes ship with tests
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[no-tests]')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          code=$(echo "$changed" | grep -E '^(lib/|scripts/|supabase/|proxy\.ts)' | grep -vE '\.test\.' || true)
          tests=$(echo "$changed" | grep -E '(^tests/|\.test\.)' || true)
          if [ -n "$code" ] && [ -z "$tests" ]; then
            echo "::error::Logic-layer files changed with no test changes. TDD: the failing test comes first and ships in the same PR. Exempt a test-free change with [no-tests] in the PR title."
            echo "$code"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: ".bun-version" }
      # A `TODO: <item>` line in the PR description must name one open TODO.md
      # item, so the dreaming workflow can move it without a model.
      - name: PR directives are well-formed
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'TODO:')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/pr-directives.ts check
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run build

  pure_tests:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54341
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-test-only
      SUPABASE_SECRET_KEY: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: ".bun-version" }
      - run: bun install --frozen-lockfile
      - run: >
          bunx vitest run --fileParallelism --maxWorkers=2
          tests/mgr-screens.test.ts tests/tap-coverage.test.ts tests/screen-links.test.ts
          tests/theme-contrast.test.ts tests/screen-persona.test.ts
          tests/design-docs.test.ts tests/docs.test.ts
  test_shard:
    name: test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: ".bun-version" }
      - run: bun install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 }
      # Only the services the tests touch: Postgres, Auth, PostgREST, Kong,
      # and mailpit (Auth delivers invite emails to it — excluding it makes
      # inviteUserByEmail fail with "Error sending invite email").
      # `start` on a fresh stack already applies supabase/migrations/*, so
      # there is no separate `db reset` step here.
      - run: supabase start --workdir tests/supabase -x studio,imgproxy,logflare,vector,edge-runtime,realtime,storage-api,supavisor,postgres-meta
      - name: Env from local stack
        # The app accepts modern Supabase names only. The mapping script keeps
        # local CLI output compatible without reintroducing runtime fallbacks.
        run: |
          supabase status --workdir tests/supabase -o env | node scripts/supabase-env.mjs >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54352/postgres" >> "$GITHUB_ENV"
          echo "MGR_TEST_STACK=1" >> "$GITHUB_ENV"
      - run: >
          bunx vitest run --shard=${{ matrix.shard }}
          --exclude tests/mgr-screens.test.ts --exclude tests/tap-coverage.test.ts
          --exclude tests/screen-links.test.ts --exclude tests/theme-contrast.test.ts
          --exclude tests/screen-persona.test.ts --exclude tests/design-docs.test.ts
          --exclude tests/docs.test.ts

  # Preserve the existing required-check name while the work runs in parallel.
  test:
    needs: [quality, pure_tests, test_shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        run: test "${{ needs.quality.result }}" = success && test "${{ needs.pure_tests.result }}" = success && test "${{ needs.test_shard.result }}" = success
