name: Claude Code Review

on:
  pull_request:
    # Not on synchronize: an Opus review on every push re-reviewed the same PR
    # many times (land-pr.sh alone pushes a main-sync commit). A PR is reviewed
    # once when it opens or leaves draft; add the `review` label to review the
    # current head again. The label must exist in the repo first (once:
    # `gh label create review`). Paths or PR-author filters are also possible; see
    # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
    types: [opened, ready_for_review, reopened, labeled]

jobs:
  claude-review:
    # Skip drafts (ready_for_review retriggers) and every bot-authored PR:
    # the action hard-fails on non-human actors, and reviewing its own output
    # adds no value. Covers dreaming/main, documentation/user-guide, mgr[bot].
    # A `labeled` event runs only for the `review` label.
    # After `simplify`, so the review reads the simplified head; !cancelled()
    # still reviews when simplify fails or is skipped.
    needs: simplify
    if: >-
      !cancelled() &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      (github.event.action != 'labeled' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The action accepts local marketplace paths, but not URL#commit refs.
      # Pin the checkout instead; the selected plugin's sources are all local.
      - name: Checkout reviewed plugin marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-code
          ref: 03b5892ee77de289bcd5dfa39f541525ade74aff
          path: .claude-review-marketplace
          persist-credentials: false

      # Official names are reserved for GitHub installs, not local checkouts.
      # Rename only the catalog identity; plugin code remains at the pin above.
      - name: Name the pinned local marketplace
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = ".claude-review-marketplace/.claude-plugin/marketplace.json";
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
          manifest.name = "mgr-reviewed-plugins";
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          NODE

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: './.claude-review-marketplace'
          plugins: 'code-review@mgr-reviewed-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Skill: the code-review plugin invokes sub-skills; without it every
          # run logged one permission denial and a wasted retry.
          # --model: the opus alias tracks the latest Opus; unpinned, the
          # action fell back to Sonnet.
          # --append-system-prompt: the plugin otherwise ends silently when no
          # finding clears its bar, which reads the same as a review that never ran.
          claude_args: '--model opus --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment" --append-system-prompt "Whenever the review ends without posting inline comments, for any reason, post one gh pr comment that starts with ## Code review and says in one line why nothing was flagged."'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

  # Claude Code's built-in /simplify on the PR's own changes, applied and
  # pushed to the PR branch. The Claude GitHub App needs contents: write to
  # push (see claude.yml); its push re-runs ci.yml on the simplified head, which
  # is the check on its edits, and claude-review then reviews it. Same-repo PRs
  # only: a fork's branch is not ours to push to. land-pr.sh requires this job's
  # success before merging.
  simplify:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # The action pushes with the Claude app token; GITHUB_TOKEN stays out of .git/config.
          persist-credentials: false
      - name: Run Claude /simplify
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /simplify Scope: only the changes this PR makes, `git diff origin/main...HEAD`.
            If files changed, `git add` them, commit with the message `refactor: apply /simplify`, and `git push origin HEAD`.
            If nothing changed, do not commit.
          # Edit and git only, never a repo script: with Edit, any script it may
          # run (package.json, lint config) is code it can rewrite while holding
          # a push token. For the same reason it cannot edit .git (hooks, config
          # run by its own git commit) or .github. The push re-runs ci.yml,
          # which land-pr.sh waits on.
          claude_args: '--model opus --allowedTools "Skill,Task,Read,Edit,Grep,Glob,Bash(git diff:*),Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD)" --disallowedTools "Edit(.git/**),Edit(.github/**)"'
      # The agent's run succeeds even when its push fails; fail the job instead,
      # since land-pr.sh reads this job's success as "simplify applied".
      - name: Simplify edits reached the PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          [ -z "$(git status --porcelain)" ] || { echo "::error::uncommitted simplify edits"; git status --short; exit 1; }
          [ "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)" ] || { echo "::error::simplify commit was not pushed"; exit 1; }
