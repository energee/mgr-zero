name: Claude Code Review

on:
  pull_request:
    # Not on synchronize: an Opus review on every push re-reviewed the same PR
    # many times (land-pr.sh alone pushes a main-sync commit). A PR is reviewed
    # once when it opens or leaves draft; add the `review` label to review the
    # current head again. The label must exist in the repo first (once:
    # `gh label create review`). Paths or PR-author filters are also possible; see
    # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
    types: [opened, ready_for_review, reopened, labeled]

jobs:
  claude-review:
    # Skip drafts (ready_for_review retriggers) and every bot-authored PR:
    # the action hard-fails on non-human actors, and reviewing its own output
    # adds no value. Covers dreaming/main, documentation/user-guide, mgr[bot].
    # A `labeled` event runs only for the `review` label.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      (github.event.action != 'labeled' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The action accepts local marketplace paths, but not URL#commit refs.
      # Pin the checkout instead; the selected plugin's sources are all local.
      - name: Checkout reviewed plugin marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-code
          ref: 03b5892ee77de289bcd5dfa39f541525ade74aff
          path: .claude-review-marketplace
          persist-credentials: false

      # Official names are reserved for GitHub installs, not local checkouts.
      # Rename only the catalog identity; plugin code remains at the pin above.
      - name: Name the pinned local marketplace
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = ".claude-review-marketplace/.claude-plugin/marketplace.json";
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
          manifest.name = "mgr-reviewed-plugins";
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          NODE

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: './.claude-review-marketplace'
          plugins: 'code-review@mgr-reviewed-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Skill: the code-review plugin invokes sub-skills; without it every
          # run logged one permission denial and a wasted retry.
          # --model: the opus alias tracks the latest Opus; unpinned, the
          # action fell back to Sonnet.
          claude_args: '--model opus --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Simplify as findings only: a CI push of simplify edits is unreviewed
      # (AGENTS.md step 5), so the author applies them. land-pr.sh requires
      # this comment and the code review comment before it merges.
      - name: Run Claude simplify review
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }} for simplification only.
            Read AGENTS.md and .pi/prompts/simplify.md, then apply those criteria to `gh pr diff ${{ github.event.pull_request.number }}` only.
            Do not edit files, commit, or push. Name each finding as file:line, the simpler form, and why.
            Then post exactly one comment with `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
            Its first line must be `## Simplify`; if nothing qualifies, the body is `## Simplify` then `No simplifications found.`
          claude_args: '--model opus --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*)"'
