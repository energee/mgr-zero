name: Claude Code

on:
  issue_comment:
    types: [created]
  # No pull_request_review trigger: every inline comment is also a one-comment
  # review, so it would fire a second (skipped) run per comment. @claude in a
  # review's summary box is the one place this leaves uncovered.
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # contents/PRs/issues write so the Claude GitHub App can commit and push.
    # With contents: read the action falls back to GITHUB_TOKEN (github-actions[bot]),
    # which 403s on git-push.sh — that is what blocked PR #212's @claude simplify.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Pin verification commands only. A `bunx *` glob would auto-approve
          # arbitrary JS on this write-capable job. Git add/commit/push stay
          # on the action's default allowlist; this list is additive.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: '--allowedTools "Bash(bunx tsc:*),Bash(bunx vitest:*),Bash(bun run lint:*),Bash(bun run test:*)"'

