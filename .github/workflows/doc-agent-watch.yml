# .github/workflows/doc-agent-watch.yml — makes a broken doc agent visible.
#
# Dreaming failed 13 days running (2026-09-29 to 2026-10-11) on one allowlist
# line, and nothing told anyone. This opens one issue per problem: a failed run
# of any doc workflow, or no `dream:` commit on main for 3 days while main moved.
# An open issue with the same title is reused, so a daily failure files once.
name: doc agent watch

on:
  workflow_run:
    workflows: ["Dreaming", "documentation agent", "http api agent"]
    types: [completed]
  schedule:
    - cron: '0 13 * * *' # daily, after the 09:00 UTC dream has had time to run

permissions: {}

jobs:
  failed-run:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Doc agent failing: $NAME"
          body="The **$NAME** workflow failed: $URL"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  stale-dream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open an issue when no dream has landed for 3 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dream=$(git log origin/main --grep='^dream:' --format=%H -1)
          [ -n "$dream" ] || { echo "no dream commit on main yet"; exit 0; }
          newer=$(git rev-list --count "$dream..origin/main")
          age=$(( ( $(date +%s) - $(git show -s --format=%ct "$dream") ) / 86400 ))
          echo "last dream ${age}d ago; ${newer} commits on main since"
          [ "$age" -ge 3 ] && [ "$newer" -gt 0 ] || exit 0
          title="Dreaming stale: no dream on main for 3+ days"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          [ -n "$open" ] && exit 0
          gh issue create --title "$title" --body "The last \`dream:\` commit on main is ${age} days old and main has moved ${newer} commits since. Check the Dreaming runs and any open \`dreaming/main\` PR."
