# .github/workflows/doc-agent-watch.yml — makes a broken doc agent, or a broken
# hosted job, visible.
#
# Dreaming failed 13 days running (2026-09-29 to 2026-10-11) on one allowlist
# line, and nothing told anyone. `hosted jobs` failed 20 runs in a row (404 from
# a stale production build) the same way. This opens one issue per problem: a
# run of any watched workflow that did not succeed, or no `dream:` commit on
# main for 3 days while main moved. Doc agent failures comment on the open issue.
# Hosted jobs deduplicate by failed job name, so repeated five-minute failures
# stay quiet but a different failing worker opens its own issue.
name: doc agent watch

on:
  workflow_run:
    workflows: ["Dreaming", "documentation agent", "http api agent", "hosted jobs"]
    types: [completed]
  schedule:
    - cron: '0 13 * * *' # daily, after the 09:00 UTC dream has had time to run

permissions: {}

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  failed-run:
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update the failure issue
        env:
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$NAME" = "hosted jobs" ]; then
            jobs=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") | .name')
            # A startup failure may have no job records.
            [ -n "$jobs" ] || jobs="workflow startup"
          else
            jobs="$NAME"
          fi
          while IFS= read -r job; do
            if [ "$NAME" = "hosted jobs" ]; then title="Hosted job failing: $job"; else title="Doc agent failing: $NAME"; fi
            body="The **$NAME / $job** workflow job ended \`$CONCLUSION\`: $URL"
            open=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
            if [ -z "$open" ]; then gh issue create --title "$title" --body "$body"
            elif [ "$NAME" = "hosted jobs" ]; then echo "hosted job $job issue #$open already open; not commenting"
            else gh issue comment "$open" --body "$body"; fi
          done <<< "$jobs"

  stale-dream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Skip when the stale issue is already open
        id: open
        run: |
          title="Dreaming stale: no dream on main for 3+ days"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.open.outputs.number == ''
        with:
          fetch-depth: 0
          filter: tree:0 # commit metadata only: log --grep and rev-list need no trees
          persist-credentials: false
      - name: Open an issue when no dream has landed for 3 days
        if: steps.open.outputs.number == ''
        env:
          TITLE: ${{ steps.open.outputs.title }}
        run: |
          dream=$(git log origin/main --grep='^dream:' --format=%H -1)
          [ -n "$dream" ] || { echo "no dream commit on main yet"; exit 0; }
          newer=$(git rev-list --count "$dream..origin/main")
          age=$(( ( $(date +%s) - $(git show -s --format=%ct "$dream") ) / 86400 ))
          echo "last dream ${age}d ago; ${newer} commits on main since"
          [ "$age" -ge 3 ] && [ "$newer" -gt 0 ] || exit 0
          gh issue create --title "$TITLE" --body "The last \`dream:\` commit on main is ${age} days old and main has moved ${newer} commits since. Check the Dreaming runs and any open \`dreaming/main\` PR."
