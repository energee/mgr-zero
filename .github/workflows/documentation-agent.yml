name: documentation agent

on:
  pull_request:
    types: [closed]

concurrency:
  group: documentation-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      result: ${{ steps.review.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture merged PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" > .docs-agent-pr.diff

      - name: Review documentation
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: Read .agents/agents/documentation-maintainer.md and perform that review.
          display_report: false
          show_full_output: false
          claude_args: >-
            --allowedTools "Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["DOCS_OK","DOCS_GAP"]},"report":{"type":"string"}},"required":["status","report"],"additionalProperties":false}'

  track-gap:
    needs: review
    if: fromJSON(needs.review.outputs.result).status == 'DOCS_GAP'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Open or refresh documentation follow-up
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.review.outputs.result }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { default: upsert } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upsert-documentation-issue.mjs`),
            );
            const result = JSON.parse(process.env.RESULT);
            await upsert({
              github,
              ...context.repo,
              pr: context.payload.pull_request.number,
              report: result.report,
            });
