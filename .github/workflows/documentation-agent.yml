name: documentation agent

on:
  pull_request:
    types: [closed]

concurrency:
  group: documentation-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      report: ${{ steps.review.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture merged PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" > .docs-agent-pr.diff

      - name: Review documentation
        id: review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .agents/agents/documentation-maintainer.md
          sandbox: read-only

  track-gap:
    needs: review
    if: needs.review.outputs.report != '' && needs.review.outputs.report != 'DOCS_OK'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Open or refresh documentation follow-up
        uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.review.outputs.report }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { default: upsert } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upsert-documentation-issue.mjs`),
            );
            await upsert({
              github,
              ...context.repo,
              pr: context.payload.pull_request.number,
              report: process.env.REPORT,
            });
