name: Dreaming

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # daily at 09:00 UTC; manual dispatch is the recovery path

concurrency:
  group: dreaming
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      new: ${{ steps.window.outputs.new }}
      changed: ${{ steps.validate.outputs.changed }}
      head: ${{ steps.window.outputs.head }}
      open_pr: ${{ steps.prepare.outputs.open_pr }}
      dream_sha: ${{ steps.prepare.outputs.dream_sha }}
      rebuilt: ${{ steps.prepare.outputs.rebuilt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint MGR GitHub App identity
        id: mgr-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MGR_APP_ID }}
          private-key: ${{ secrets.MGR_APP_PRIVATE_KEY }}
          permission-metadata: read

      - name: Find the accepted and checked windows
        id: window
        run: |
          git fetch origin '+refs/dreaming/last-checked:refs/dreaming/last-checked' || true
          checked=$(git rev-parse -q --verify refs/dreaming/last-checked || true)
          base=$(git log origin/main --grep='^dream:' --format=%H -1)
          if [ -z "$base" ]; then
            base=$(git rev-list --max-count=26 origin/main | tail -1)
          fi
          head=$(git rev-parse origin/main)
          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$checked" ] && [ "$checked" = "$head" ]; then
            echo "Nothing new since last dream check $checked — skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif [ "$base" = "$head" ]; then
            echo "HEAD is the last accepted dream — nothing to curate."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare cumulative dream documents
        if: steps.window.outputs.new == 'true'
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.mgr-app.outputs.app-slug }}
        run: |
          # The model runs on a checked-out dreaming/main, so its deny list is taken from main.
          git show origin/main:.github/claude-ci-settings.json > "$RUNNER_TEMP/claude-ci-settings.json"
          open_pr=$(gh pr list --base main --head dreaming/main --state open --json number --jq '.[0].number // empty')
          # The dreaming/main head this run builds on; publish's push lease is pinned to it.
          dream_sha=$(git rev-parse -q --verify origin/dreaming/main || true)
          rebuilt=false
          # Merge and dream commits alike are the MGR GitHub App, so nothing needs re-authoring later.
          login="${APP_SLUG}[bot]"
          git config user.name "$login"
          id="$(gh api "users/${login}" --jq .id)"
          git config user.email "${id}+${login}@users.noreply.github.com"
          if [ -n "$open_pr" ]; then
            git checkout -B dreaming/main origin/dreaming/main
            if ! git merge --no-edit origin/main; then
              # A conflicting dream branch is abandoned: this run dreams on main, and the
              # next publish force-pushes that as the new dreaming/main and says so in the PR.
              echo "::warning::dreaming/main no longer merges with main; dreaming on main instead. The next publish rebuilds dreaming/main from it and drops the open dream PR's unmerged edits."
              git merge --abort || true
              git checkout -B dreaming/main origin/main
              rebuilt=true
            fi
          fi
          {
            echo "open_pr=$open_pr"
            echo "dream_sha=$dream_sha"
            echo "rebuilt=$rebuilt"
            echo "login=$login"
            echo "email=${id}+${login}@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - name: Run dream
        if: steps.window.outputs.new == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: '${{ github.token }}'
          allowed_bots: 'github-actions'
          show_full_output: false
          settings: ${{ runner.temp }}/claude-ci-settings.json
          prompt: >-
            You are running inside GitHub Actions (GITHUB_ACTIONS=true); the CI-only guard is satisfied.
            The last accepted dream on main is ${{ steps.window.outputs.base }} and current main HEAD is
            ${{ steps.window.outputs.head }}. Read .agents/agents/dreaming.md and follow it exactly.
          claude_args: '--allowedTools "Read,Glob,Grep,Edit(.agents/MEMORY.md),Edit(.agents/PROGRESS.md),Edit(.agents/ARCHITECTURE.md),Edit(.agents/DRIFT.md),Edit(.agents/agents/*.md),Edit(AGENTS.md),Write(.agents/MEMORY.md),Write(.agents/PROGRESS.md),Write(.agents/ARCHITECTURE.md),Write(.agents/DRIFT.md),Write(.agents/agents/*.md),Write(AGENTS.md),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh pr list:*),Bash(gh pr view:*)"'

      - name: Validate dream changes
        if: steps.window.outputs.new == 'true'
        id: validate
        env:
          DREAM_SHA: ${{ steps.prepare.outputs.dream_sha }}
          # The model run rewrites this repo's git identity to claude[bot], so the
          # dream commit names its author explicitly instead of trusting the config
          # set before it.
          DREAM_LOGIN: ${{ steps.prepare.outputs.login }}
          DREAM_EMAIL: ${{ steps.prepare.outputs.email }}
        run: |
          git add -A
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              .agents/MEMORY.md|.agents/PROGRESS.md|.agents/ARCHITECTURE.md|.agents/DRIFT.md|.agents/agents/*.md|AGENTS.md) ;;
              *) echo "Dream changed forbidden path: $path"; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
          git -c "user.name=$DREAM_LOGIN" -c "user.email=$DREAM_EMAIL" \
            commit -q -m "dream: agent doc maintenance"
          # A bundle of the validated commit, not a patch: publish pushes exactly this
          # tree, so it never re-merges main or needs preimage blobs for a 3-way apply.
          # Edits that land on main during the model run leave the PR one merge behind,
          # which GitHub shows as usual and the next dream's merge absorbs. Only commits
          # publish cannot already reach (main, the observed dreaming/main) are packed.
          git bundle create dream.bundle HEAD ^origin/main ${DREAM_SHA:+^$DREAM_SHA}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Save dream bundle
        if: steps.validate.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dream-bundle
          if-no-files-found: error
          path: dream.bundle

  publish:
    needs: maintain
    if: needs.maintain.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Mint MGR GitHub App token
        id: mgr-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MGR_APP_ID }}
          private-key: ${{ secrets.MGR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.mgr-app.outputs.token }}

      - name: Restore dream bundle
        if: needs.maintain.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dream-bundle
          path: ${{ runner.temp }}

      - name: Publish dream pull request
        if: needs.maintain.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.mgr-app.outputs.token }}
          EXPECTED_PR: ${{ needs.maintain.outputs.open_pr }}
          EXPECTED_SHA: ${{ needs.maintain.outputs.dream_sha }}
          REBUILT: ${{ needs.maintain.outputs.rebuilt }}
        run: |
          current_pr=$(gh pr list --base main --head dreaming/main --state open --json number --jq '.[0].number // empty')
          [ "$current_pr" = "$EXPECTED_PR" ] || { echo "Dream PR changed during curation; retry without advancing the marker."; exit 1; }
          git fetch "$RUNNER_TEMP/dream.bundle" HEAD
          git checkout -B dreaming/main FETCH_HEAD
          body="Curates the living agent documents from merged evidence. Outstanding read-only drift is tracked in .agents/DRIFT.md; the diff is the authoritative change summary."
          if [ "$REBUILT" = "true" ]; then
            body=$(printf '%s\n\n%s' "$body" "dreaming/main no longer merged with main, so it was rebuilt from main. Edits from the previous dream PR that main had not merged were dropped.")
          fi
          # The lease is the dreaming/main head maintain built on (empty: branch absent),
          # so a commit pushed during the model run rejects the push instead of vanishing.
          git push --force-with-lease="refs/heads/dreaming/main:${EXPECTED_SHA}" origin dreaming/main
          if [ -n "$EXPECTED_PR" ]; then
            [ "$(gh pr view "$EXPECTED_PR" --json state --jq .state)" = "OPEN" ] || exit 1
            gh pr edit "$EXPECTED_PR" --title "dream: agent doc maintenance" --body "$body"
          else
            gh pr create --base main --head dreaming/main --title "dream: agent doc maintenance" --body "$body"
          fi

      - name: Advance the last-checked marker
        run: git push -f origin '${{ needs.maintain.outputs.head }}:refs/dreaming/last-checked'
