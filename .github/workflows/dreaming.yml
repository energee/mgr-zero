name: Dreaming

on:
  push:
    branches: [main]
    paths-ignore: ['.agents/**.md', 'AGENTS.md', '.remember/**']
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # daily dream at 09:00 UTC (~4-5am ET); no-ops when there's nothing to curate

concurrency:
  group: dreaming
  cancel-in-progress: true

jobs:
  dream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the dream reads history since the last dream

      - name: Run dream
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Read .agents/agents/dreaming.md and follow it exactly.'
          # The push entries below are exact-match on purpose (not `git push:*`),
          # so an injected dream cannot push to any branch but dreaming/main —
          # in particular, never to main — and gh is limited to PR list/create/
          # edit/view, so a dream can never merge a PR.
          claude_args: '--allowedTools "Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git config user.name:*),Bash(git config user.email:*),Bash(git push -f origin dreaming/main),Bash(git push origin dreaming/main),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*)"'
        env:
          GH_TOKEN: ${{ github.token }}
