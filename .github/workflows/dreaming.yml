name: Dreaming

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # daily at 09:00 UTC; manual dispatch is the recovery path

concurrency:
  group: dreaming
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      new: ${{ steps.window.outputs.new }}
      changed: ${{ steps.validate.outputs.changed }}
      head: ${{ steps.window.outputs.head }}
      open_pr: ${{ steps.prepare.outputs.open_pr }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the accepted and checked windows
        id: window
        run: |
          git fetch origin '+refs/dreaming/last-checked:refs/dreaming/last-checked' || true
          checked=$(git rev-parse -q --verify refs/dreaming/last-checked || true)
          base=$(git log origin/main --grep='^dream:' --format=%H -1)
          if [ -z "$base" ]; then
            base=$(git rev-list --max-count=26 origin/main | tail -1)
          fi
          head=$(git rev-parse origin/main)
          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$checked" ] && [ "$checked" = "$head" ]; then
            echo "Nothing new since last dream check $checked — skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif [ "$base" = "$head" ]; then
            echo "HEAD is the last accepted dream — nothing to curate."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare cumulative dream documents
        if: steps.window.outputs.new == 'true'
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_pr=$(gh pr list --base main --head dreaming/main --state open --json number --jq '.[0].number // empty')
          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"
          if [ -n "$open_pr" ]; then
            git checkout -B dreaming/main origin/dreaming/main
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # A conflicting dream branch is abandoned; publish force-pushes a fresh one.
            git merge --no-edit origin/main || { git merge --abort; git checkout -B dreaming/main origin/main; }
          fi

      - name: Run dream
        if: steps.window.outputs.new == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: '${{ github.token }}'
          allowed_bots: 'github-actions'
          show_full_output: false
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(/proc/**)",
                  "Read(/etc/**)",
                  "Read(/home/runner/.*/**)",
                  "Read(/home/runner/.config/**)",
                  "Read(/home/runner/.cache/**)",
                  "Read(/home/runner/.ssh/**)",
                  "Read(/home/runner/.gitconfig)",
                  "Read(/home/runner/.npmrc)",
                  "Read(/home/runner/.netrc)",
                  "Read(/home/runner/work/_temp/**)",
                  "Read(/github/home/**)",
                  "Read(**/.env*)",
                  "Read(**/*token*)",
                  "Grep(/proc/**)",
                  "Grep(/etc/**)",
                  "Grep(/home/runner/.*/**)",
                  "Grep(/home/runner/.config/**)",
                  "Grep(/home/runner/.cache/**)",
                  "Grep(/home/runner/.ssh/**)",
                  "Grep(/home/runner/.gitconfig)",
                  "Grep(/home/runner/.npmrc)",
                  "Grep(/home/runner/.netrc)",
                  "Grep(/home/runner/work/_temp/**)",
                  "Grep(/github/home/**)",
                  "Grep(**/.env*)",
                  "Grep(**/*token*)",
                  "Glob(/proc/**)",
                  "Glob(/etc/**)",
                  "Glob(/home/runner/.*/**)",
                  "Glob(/home/runner/.config/**)",
                  "Glob(/home/runner/.cache/**)",
                  "Glob(/home/runner/.ssh/**)",
                  "Glob(/home/runner/work/_temp/**)",
                  "Glob(/github/home/**)",
                  "Glob(**/.env*)",
                  "Glob(**/*token*)"
                ]
              }
            }
          prompt: >-
            You are running inside GitHub Actions (GITHUB_ACTIONS=true); the CI-only guard is satisfied.
            The last accepted dream on main is ${{ steps.window.outputs.base }} and current main HEAD is
            ${{ steps.window.outputs.head }}. Read .agents/agents/dreaming.md and follow it exactly.
          claude_args: '--allowedTools "Read,Glob,Grep,Edit(.agents/MEMORY.md),Edit(.agents/PROGRESS.md),Edit(.agents/ARCHITECTURE.md),Edit(.agents/DRIFT.md),Edit(.agents/agents/*.md),Edit(AGENTS.md),Write(.agents/MEMORY.md),Write(.agents/PROGRESS.md),Write(.agents/ARCHITECTURE.md),Write(.agents/DRIFT.md),Write(.agents/agents/*.md),Write(AGENTS.md),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh pr list:*),Bash(gh pr view:*)"'

      - name: Validate dream changes
        if: steps.window.outputs.new == 'true'
        id: validate
        run: |
          git add -A
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              .agents/MEMORY.md|.agents/PROGRESS.md|.agents/ARCHITECTURE.md|.agents/DRIFT.md|.agents/agents/*.md|AGENTS.md) ;;
              *) echo "Dream changed forbidden path: $path"; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
          # A patch, not file snapshots: publish applies it 3-way onto whatever main
          # is by then, so edits that landed during the model run are kept.
          git diff --cached --binary > dream.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Save dream patch
        if: steps.validate.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dream-patch
          if-no-files-found: error
          path: dream.patch

  publish:
    needs: maintain
    if: needs.maintain.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Mint MGR GitHub App token
        id: mgr-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MGR_APP_ID }}
          private-key: ${{ secrets.MGR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.mgr-app.outputs.token }}

      - name: Prepare publication branch
        env:
          GH_TOKEN: ${{ steps.mgr-app.outputs.token }}
          EXPECTED_PR: ${{ needs.maintain.outputs.open_pr }}
          APP_SLUG: ${{ steps.mgr-app.outputs.app-slug }}
        run: |
          current_pr=$(gh pr list --base main --head dreaming/main --state open --json number --jq '.[0].number // empty')
          if [ "$current_pr" != "$EXPECTED_PR" ]; then
            echo "Dream PR changed during curation; retry without advancing the marker."
            exit 1
          fi
          login="${APP_SLUG}[bot]"
          git config user.name "$login"
          id="$(gh api "users/${login}" --jq .id)"
          git config user.email "${id}+${login}@users.noreply.github.com"
          if [ "${{ needs.maintain.outputs.changed }}" = "true" ]; then
            if [ -n "$EXPECTED_PR" ]; then
              git checkout -B dreaming/main origin/dreaming/main
              git merge --no-edit origin/main || { git merge --abort; git checkout -B dreaming/main origin/main; }
            else
              git checkout -B dreaming/main origin/main
            fi
          fi

      - name: Restore dream patch
        if: needs.maintain.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dream-patch
          path: ${{ runner.temp }}

      - name: Apply dream patch
        if: needs.maintain.outputs.changed == 'true'
        run: git apply --3way --index "$RUNNER_TEMP/dream.patch"

      - name: Publish dream pull request
        if: needs.maintain.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.mgr-app.outputs.token }}
          EXPECTED_PR: ${{ needs.maintain.outputs.open_pr }}
        run: |
          git add -A
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then
            echo "Nothing to dream about"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              .agents/MEMORY.md|.agents/PROGRESS.md|.agents/ARCHITECTURE.md|.agents/DRIFT.md|.agents/agents/*.md|AGENTS.md) ;;
              *) echo "Dream changed forbidden path: $path"; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
          git commit -m "dream: agent doc maintenance"
          body="Curates the living agent documents from merged evidence. Outstanding read-only drift is tracked in .agents/DRIFT.md; the diff is the authoritative change summary."
          if [ -n "$EXPECTED_PR" ]; then
            [ "$(gh pr view "$EXPECTED_PR" --json state --jq .state)" = "OPEN" ] || exit 1
            git push -f origin dreaming/main
            [ "$(gh pr view "$EXPECTED_PR" --json state --jq .state)" = "OPEN" ] || exit 1
            gh pr edit "$EXPECTED_PR" --title "dream: agent doc maintenance" --body "$body"
          else
            git push -f origin dreaming/main
            gh pr create --base main --head dreaming/main --title "dream: agent doc maintenance" --body "$body"
          fi

      - name: Advance the last-checked marker
        run: git push -f origin '${{ needs.maintain.outputs.head }}:refs/dreaming/last-checked'
