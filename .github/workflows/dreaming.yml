name: Dreaming

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # daily at 09:00 UTC; manual dispatch is the recovery path

concurrency:
  group: dreaming
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      new: ${{ steps.window.outputs.new }}
      changed: ${{ steps.validate.outputs.changed }}
      findings: ${{ steps.validate.outputs.findings }}
      head: ${{ steps.window.outputs.head }}
      open_pr: ${{ steps.prepare.outputs.open_pr }}
      dream_sha: ${{ steps.prepare.outputs.dream_sha }}
      rebuilt: ${{ steps.prepare.outputs.rebuilt }}
      login: ${{ steps.prepare.outputs.login }}
      email: ${{ steps.prepare.outputs.email }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint MGR GitHub App identity
        id: mgr-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MGR_APP_ID }}
          private-key: ${{ secrets.MGR_APP_PRIVATE_KEY }}
          permission-metadata: read

      - name: Find the accepted and checked windows
        id: window
        run: |
          git fetch origin '+refs/dreaming/last-checked:refs/dreaming/last-checked' || true
          checked=$(git rev-parse -q --verify refs/dreaming/last-checked || true)
          base=$(git log origin/main --grep='^dream:' --format=%H -1)
          if [ -z "$base" ]; then
            base=$(git rev-list --max-count=26 origin/main | tail -1)
          fi
          head=$(git rev-parse origin/main)
          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$checked" ] && [ "$checked" = "$head" ]; then
            echo "Nothing new since last dream check $checked — skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif [ "$base" = "$head" ]; then
            echo "HEAD is the last accepted dream — nothing to curate."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare cumulative dream documents
        if: steps.window.outputs.new == 'true'
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.mgr-app.outputs.app-slug }}
          MAIN_HEAD: ${{ steps.window.outputs.head }}
        run: |
          # The model runs on a checked-out dreaming/main, so its deny list is taken from main.
          git show origin/main:.github/claude-ci-settings.json > "$RUNNER_TEMP/claude-ci-settings.json"
          open_pr=$(gh pr list --base main --head dreaming/main --state open --json number --jq '.[0].number // empty')
          # The dreaming/main head this run builds on; publish's push lease is pinned to it.
          dream_sha=$(git rev-parse -q --verify origin/dreaming/main || true)
          rebuilt=false
          # Trusted bot identity is also passed to the independent publisher.
          login="${APP_SLUG}[bot]"
          git config user.name "$login"
          id="$(gh api "users/${login}" --jq .id)"
          git config user.email "${id}+${login}@users.noreply.github.com"
          if [ -n "$open_pr" ]; then
            git checkout -B dreaming/main origin/dreaming/main
            if ! git merge --no-edit origin/main; then
              # A conflicting dream branch is abandoned: this run dreams on main, and the
              # next publish force-pushes that as the new dreaming/main and says so in the PR.
              echo "::warning::dreaming/main no longer merges with main; dreaming on main instead. The next publish rebuilds dreaming/main from it and drops the open dream PR's unmerged edits."
              git merge --abort || true
              git checkout -B dreaming/main origin/main
              rebuilt=true
            fi
          else
            # Checkout pins github.sha, which lags main if main moved while this run queued;
            # publish requires the bundle to descend from the recorded head.
            git checkout -B dreaming/main "$MAIN_HEAD"
          fi
          {
            echo "open_pr=$open_pr"
            echo "dream_sha=$dream_sha"
            echo "rebuilt=$rebuilt"
            echo "login=$login"
            echo "email=${id}+${login}@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      # Mechanical first: PRs merged in the window that carry `TODO: <item>` move
      # that item out of TODO.md and onto PROGRESS.md's Done log here, as does an item whose linked
      # issue closed as completed, so the roadmap advances even when the model has nothing to dream
      # about. scripts/pr-directives.ts.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.window.outputs.new == 'true'
        with: { bun-version-file: ".bun-version" }
      - name: Move finished TODO items to Done
        if: steps.window.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/pr-directives.ts todo "${{ steps.window.outputs.base }}" "${{ steps.window.outputs.head }}"

      # The model may not run gh issue, so the open doc-agent-watch issues reach it here
      # (dreaming.md "Recurring friction"). Titles and comment counts are enough to see a repeat.
      - name: Collect open watchdog issues
        if: steps.window.outputs.new == 'true'
        id: watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only issues the watchdog itself filed (github.token = github-actions), so no outside text reaches the prompt.
          issues=$(gh issue list --state open --author app/github-actions --search 'in:title "failing" OR in:title "Dreaming stale"' --limit 20 \
            --json number,title,comments --jq '.[] | "#\(.number) \(.title) (\(.comments | length) comments)"')
          { echo "list<<WATCHDOG_EOF"; echo "${issues:-none}"; echo "WATCHDOG_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Capture trusted Git evidence
        if: steps.window.outputs.new == 'true'
        env:
          ACCEPTED_BASE: ${{ steps.window.outputs.base }}
          MAIN_HEAD: ${{ steps.window.outputs.head }}
        run: |
          # Inside .git so Read can see it without git add including it in the bundle.
          git --no-pager log --no-ext-diff --stat "$ACCEPTED_BASE..$MAIN_HEAD" > .git/dream-evidence.log
          # Documentation added in the window, for dreaming.md "Integrate new and missed documentation".
          git diff --name-only --diff-filter=A "$ACCEPTED_BASE" "$MAIN_HEAD" -- '*.md' '*.mdx' > .git/dream-new-docs.txt

      - name: Run dream
        if: steps.window.outputs.new == 'true'
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: '${{ github.token }}'
          allowed_bots: 'github-actions'
          show_full_output: false
          settings: ${{ runner.temp }}/claude-ci-settings.json
          prompt: >-
            You are running inside GitHub Actions (GITHUB_ACTIONS=true); the CI-only guard is satisfied.
            The last accepted dream on main is ${{ steps.window.outputs.base }} and current main HEAD is
            ${{ steps.window.outputs.head }}. Read .agents/agents/dreaming.md and follow it exactly.
            Open watchdog issues (WATCHDOG_ISSUES): ${{ steps.watchdog.outputs.list }}
          # Cross-document synthesis needs stronger reasoning than bounded maintenance.
          claude_args: '--model sonnet --permission-mode dontAsk --disallowedTools "Bash(git:*)" --allowedTools "Read,Glob,Grep,Edit(.agents/MEMORY.md),Edit(.agents/PROGRESS.md),Edit(.agents/ARCHITECTURE.md),Edit(.agents/DRIFT.md),Edit(.agents/agents/*.md),Edit(AGENTS.md),Write(.agents/MEMORY.md),Write(.agents/PROGRESS.md),Write(.agents/ARCHITECTURE.md),Write(.agents/DRIFT.md),Write(.agents/agents/*.md),Write(AGENTS.md),Write(.dream-findings.jsonl),Bash(gh pr list:*),Bash(gh pr view:*)"'

      - name: Validate dream changes
        if: steps.window.outputs.new == 'true'
        id: validate
        env:
          DREAM_SHA: ${{ steps.prepare.outputs.dream_sha }}
          # The model run rewrites this repo's git identity to claude[bot], so the
          # dream commit names its author explicitly instead of trusting the config
          # set before it.
          DREAM_LOGIN: ${{ steps.prepare.outputs.login }}
          DREAM_EMAIL: ${{ steps.prepare.outputs.email }}
        run: |
          # Overlooked-documentation findings become issues in the report job, never part of the dream.
          if [ -s .dream-findings.jsonl ]; then
            mv .dream-findings.jsonl "$RUNNER_TEMP/dream-findings.jsonl"
            echo "findings=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f .dream-findings.jsonl
          git add -A
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              .agents/MEMORY.md|.agents/PROGRESS.md|.agents/ARCHITECTURE.md|.agents/DRIFT.md|.agents/agents/*.md|AGENTS.md|TODO.md) ;;
              *) echo "Dream changed forbidden path: $path"; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
          git -c "user.name=$DREAM_LOGIN" -c "user.email=$DREAM_EMAIL" \
            commit -q -m "dream: agent doc maintenance"
          # Publish independently checks this entire tree against the recorded main
          # head; this staged-path check is only early feedback, not a trust boundary.
          # Edits that land on main during the model run leave the PR one merge behind,
          # which GitHub shows as usual and the next dream's merge absorbs. Only commits
          # publish cannot already reach (main, the observed dreaming/main) are packed.
          git bundle create dream.bundle HEAD ^origin/main ${DREAM_SHA:+^$DREAM_SHA}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Save dream bundle
        if: steps.validate.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dream-bundle
          if-no-files-found: error
          path: dream.bundle

      # always(): a dream rejected by validation still reports what it found.
      - name: Save dream findings
        if: always() && steps.validate.outputs.findings == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dream-findings
          if-no-files-found: error
          path: ${{ runner.temp }}/dream-findings.jsonl

  # The model job has no issue access; this deterministic job files what it overlooked.
  report:
    needs: maintain
    if: always() && needs.maintain.outputs.findings == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dream-findings
          path: ${{ runner.temp }}
      - name: List overlooked documentation in the agent's Docs gaps issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/file-doc-findings.sh "$RUNNER_TEMP/dream-findings.jsonl" "dreaming agent"

  publish:
    needs: maintain
    if: needs.maintain.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Mint MGR GitHub App token
        id: mgr-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MGR_APP_ID }}
          private-key: ${{ secrets.MGR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.mgr-app.outputs.token }}

      - name: Restore dream bundle
        if: needs.maintain.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dream-bundle
          path: ${{ runner.temp }}

      - name: Publish dream pull request
        if: needs.maintain.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.mgr-app.outputs.token }}
          EXPECTED_PR: ${{ needs.maintain.outputs.open_pr }}
          EXPECTED_SHA: ${{ needs.maintain.outputs.dream_sha }}
          REBUILT: ${{ needs.maintain.outputs.rebuilt }}
          TRUSTED_BASE: ${{ needs.maintain.outputs.head }}
          DREAM_LOGIN: ${{ needs.maintain.outputs.login }}
          DREAM_EMAIL: ${{ needs.maintain.outputs.email }}
        run: |
          current_pr=$(gh pr list --base main --head dreaming/main --state open --json number --jq '.[0].number // empty')
          [ "$current_pr" = "$EXPECTED_PR" ] || { echo "Dream PR changed during curation; retry without advancing the marker."; exit 1; }
          git fetch "$RUNNER_TEMP/dream.bundle" HEAD
          # Never trust the producer's HEAD, staged delta, or path validation. The
          # recorded main head predates the model; fresh origin/main may have advanced.
          git merge-base --is-ancestor "$TRUSTED_BASE" FETCH_HEAD || {
            echo "Dream bundle does not descend from the recorded main head."; exit 1;
          }
          git diff --no-renames --name-only -z "$TRUSTED_BASE" FETCH_HEAD > "$RUNNER_TEMP/dream-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              .agents/agents/*/*) echo "Dream bundle changed forbidden path: $path"; exit 1 ;;
              .agents/MEMORY.md|.agents/PROGRESS.md|.agents/ARCHITECTURE.md|.agents/DRIFT.md|.agents/agents/*.md|AGENTS.md|TODO.md) ;;
              *) echo "Dream bundle changed forbidden path: $path"; exit 1 ;;
            esac
            # Documents may be deleted or regular text blobs, never symlinks,
            # executable files, or submodules masquerading as allowed Markdown.
            mode=$(git ls-tree --format='%(objectmode)' FETCH_HEAD -- "$path")
            case "$mode" in
              ''|100644) ;;
              *) echo "Dream bundle changed document type: $path ($mode)"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/dream-paths"
          # Publish only this validated snapshot, never the producer's commit
          # history: an intermediate commit could contain a later-deleted secret.
          git checkout -B dreaming/main "$TRUSTED_BASE"
          git read-tree --reset -u FETCH_HEAD
          git -c "user.name=$DREAM_LOGIN" -c "user.email=$DREAM_EMAIL" \
            commit --allow-empty -q -m "dream: agent doc maintenance"
          body="Curates the living agent documents from merged evidence. Outstanding read-only drift is tracked in .agents/DRIFT.md; the diff is the authoritative change summary."
          if [ "$REBUILT" = "true" ]; then
            body=$(printf '%s\n\n%s' "$body" "dreaming/main no longer merged with main, so it was rebuilt from main. Edits from the previous dream PR that main had not merged were dropped.")
          fi
          # The lease is the dreaming/main head maintain built on (empty: branch absent),
          # so a commit pushed during the model run rejects the push instead of vanishing.
          git push --force-with-lease="refs/heads/dreaming/main:${EXPECTED_SHA}" origin dreaming/main
          if [ -n "$EXPECTED_PR" ]; then
            [ "$(gh pr view "$EXPECTED_PR" --json state --jq .state)" = "OPEN" ] || exit 1
            gh pr edit "$EXPECTED_PR" --title "dream: agent doc maintenance" --body "$body"
          else
            gh pr create --base main --head dreaming/main --title "dream: agent doc maintenance" --body "$body"
          fi

      - name: Advance the last-checked marker
        run: git push -f origin '${{ needs.maintain.outputs.head }}:refs/dreaming/last-checked'
